<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- ================= Title ================= -->
  <text x="64" y="58" font-size="27" font-weight="700" fill="#0F172A">System Architecture</text>
  <text x="64" y="84" font-size="14.5" fill="#64748B">AI/ML noise suppression for defence communications — train offline, deploy to the edge</text>

  <!-- ================= BAND 1: OFFLINE ================= -->
  <rect x="64" y="112" width="1152" height="196" rx="14" fill="#FBFDFF" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="88" y="140" font-size="12.5" font-weight="700" fill="#475569" letter-spacing="1.3">OFFLINE · TRAINING PIPELINE (GPU)</text>

  <!-- 1 Corpora -->
  <rect x="88" y="156" width="238" height="128" rx="12" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.7"/>
  <g transform="translate(112,182)" stroke="#2563EB" stroke-width="1.7" fill="none" stroke-linejoin="round">
    <path d="M0 4 a2 2 0 0 1 2-2 h7 l3 3 h10 a2 2 0 0 1 2 2 v13 a2 2 0 0 1-2 2 H2 a2 2 0 0 1-2-2 z"/>
  </g>
  <text x="150" y="197" font-size="16.5" font-weight="600" fill="#0F172A">Speech + Noise</text>
  <text x="112" y="230" font-size="13" fill="#475569">LibriSpeech · VCTK</text>
  <text x="112" y="250" font-size="13" fill="#475569">Military Audio Dataset</text>
  <text x="112" y="270" font-size="13" fill="#475569">ESC-50 (siren · wind)</text>

  <!-- 2 Dataset pipeline -->
  <rect x="358" y="156" width="238" height="128" rx="12" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.7"/>
  <g transform="translate(382,182)" stroke="#2563EB" stroke-width="1.7" fill="none" stroke-linecap="round">
    <path d="M0 4 h8 M0 16 h8"/><path d="M8 4 C16 4 16 16 24 16 M8 16 C16 16 16 4 24 4"/>
  </g>
  <text x="420" y="197" font-size="16.5" font-weight="600" fill="#0F172A">Dataset Pipeline</text>
  <text x="382" y="230" font-size="13" fill="#475569">on-the-fly mixing</text>
  <text x="382" y="250" font-size="13" fill="#475569">SNR -5 to +20 dB</text>
  <text x="382" y="270" font-size="13" fill="#475569">impulsive oversampling</text>

  <!-- 3 Fine-tuning -->
  <rect x="628" y="156" width="238" height="128" rx="12" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.7"/>
  <g transform="translate(652,184)">
    <circle cx="3" cy="6" r="3.2" fill="#2563EB"/><circle cx="3" cy="18" r="3.2" fill="#2563EB"/>
    <circle cx="15" cy="0" r="3.2" fill="#2563EB"/><circle cx="15" cy="12" r="3.2" fill="#2563EB"/><circle cx="15" cy="24" r="3.2" fill="#2563EB"/>
    <circle cx="27" cy="6" r="3.2" fill="#2563EB"/><circle cx="27" cy="18" r="3.2" fill="#2563EB"/>
    <g stroke="#2563EB" stroke-width="0.9" opacity="0.55">
      <path d="M6 6 L12 0 M6 6 L12 12 M6 18 L12 12 M6 18 L12 24 M18 0 L24 6 M18 12 L24 6 M18 12 L24 18 M18 24 L24 18"/>
    </g>
  </g>
  <text x="690" y="197" font-size="16.5" font-weight="600" fill="#0F172A">Fine-Tuning</text>
  <text x="652" y="230" font-size="13" fill="#475569">GTCRN · 48K params</text>
  <text x="652" y="250" font-size="13" fill="#475569">SI-SNR + MR-STFT loss</text>
  <text x="652" y="270" font-size="13" fill="#475569">per-epoch checkpoints</text>

  <!-- 4 Model artifact -->
  <rect x="898" y="156" width="238" height="128" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.4"/>
  <g transform="translate(922,182)" stroke="#059669" stroke-width="1.7" fill="none" stroke-linejoin="round">
    <path d="M12 0 L24 6 v12 L12 24 L0 18 V6 z M0 6 L12 12 L24 6 M12 12 v12"/>
  </g>
  <text x="960" y="197" font-size="16.5" font-weight="700" fill="#064E3B">ONNX Model</text>
  <text x="922" y="230" font-size="13" fill="#047857">streaming · opset 11</text>
  <text x="922" y="250" font-size="13" fill="#047857">INT8 quantised · ~1 MB</text>
  <text x="922" y="270" font-size="13" fill="#047857">gtcrn_defence.onnx</text>

  <!-- band-1 arrows -->
  <line x1="326" y1="220" x2="352" y2="220" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="596" y1="220" x2="622" y2="220" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="866" y1="220" x2="892" y2="220" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ================= DEPLOY connector ================= -->
  <path d="M1017 284 V 352" fill="none" stroke="#10B981" stroke-width="2.4" marker-end="url(#arG)"/>
  <rect x="1035" y="300" width="74" height="25" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1072" y="317" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">deploy</text>

  <!-- validation branch -->
  <path d="M898 220 H 860" fill="none" stroke="none"/>
  <path d="M1136 220 H 1176 V 470 H 1152" fill="none" stroke="#CA8A04" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <!-- ================= BAND 2: RUNTIME ================= -->
  <rect x="64" y="360" width="1000" height="196" rx="14" fill="#FBFEFE" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="88" y="388" font-size="12.5" font-weight="700" fill="#475569" letter-spacing="1.3">RUNTIME · EDGE DEVICE (RASPBERRY PI 5 — CPU ONLY)</text>

  <!-- E1 capture -->
  <rect x="88" y="404" width="222" height="128" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/>
  <g transform="translate(112,430)" stroke="#0F766E" stroke-width="1.7" fill="none" stroke-linecap="round">
    <path d="M9 2 a4 4 0 0 1 8 0 v9 a4 4 0 0 1-8 0 z M4 12 a9 9 0 0 0 18 0 M13 21 v4"/>
  </g>
  <text x="150" y="445" font-size="16.5" font-weight="600" fill="#134E4A">Audio Capture</text>
  <text x="112" y="478" font-size="13" fill="#0F766E">primary + reference mic</text>
  <text x="112" y="498" font-size="13" fill="#0F766E">16 kHz mono</text>
  <text x="112" y="518" font-size="13" fill="#0F766E">16 ms hops</text>

  <!-- E2 STFT -->
  <rect x="342" y="404" width="222" height="128" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/>
  <g transform="translate(366,432)">
    <rect x="0" y="10" width="4" height="10" rx="2" fill="#0F766E"/>
    <rect x="7" y="4" width="4" height="22" rx="2" fill="#0F766E"/>
    <rect x="14" y="0" width="4" height="30" rx="2" fill="#0F766E"/>
    <rect x="21" y="7" width="4" height="16" rx="2" fill="#0F766E"/>
  </g>
  <text x="404" y="445" font-size="16.5" font-weight="600" fill="#134E4A">STFT Analysis</text>
  <text x="366" y="478" font-size="13" fill="#0F766E">32 ms window</text>
  <text x="366" y="498" font-size="13" fill="#0F766E">causal · zero lookahead</text>
  <text x="366" y="518" font-size="13" fill="#0F766E">ring buffer</text>

  <!-- E3 inference -->
  <rect x="596" y="404" width="222" height="128" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.2"/>
  <g transform="translate(620,430)" stroke="#0F766E" stroke-width="1.7" fill="none" stroke-linejoin="round">
    <path d="M14 0 L2 15 h9 l-3 11 L20 11 h-9 z"/>
  </g>
  <text x="658" y="445" font-size="16.5" font-weight="600" fill="#134E4A">ONNX Runtime</text>
  <text x="620" y="478" font-size="13" fill="#0F766E">complex mask</text>
  <text x="620" y="498" font-size="13" fill="#0F766E">recurrent state carried</text>
  <text x="620" y="518" font-size="13" fill="#0F766E">RTF 0.09</text>

  <!-- E4 output -->
  <rect x="850" y="404" width="190" height="128" rx="12" fill="#0F172A"/>
  <g transform="translate(874,432)" stroke="#5EEAD4" stroke-width="1.7" fill="none" stroke-linecap="round">
    <path d="M2 14 v-3 a10 10 0 0 1 20 0 v3"/>
    <rect x="0" y="13" width="6" height="10" rx="3" fill="#5EEAD4" stroke="none"/>
    <rect x="18" y="13" width="6" height="10" rx="3" fill="#5EEAD4" stroke="none"/>
  </g>
  <text x="912" y="445" font-size="16.5" font-weight="700" fill="#FFFFFF">Clean Output</text>
  <text x="874" y="478" font-size="13" fill="#94A3B8">iSTFT · overlap-add</text>
  <text x="874" y="498" font-size="13" fill="#94A3B8">headset / comms</text>
  <text x="874" y="518" font-size="13" fill="#5EEAD4">83.6 ms end-to-end</text>

  <!-- band-2 arrows -->
  <line x1="310" y1="468" x2="336" y2="468" stroke="#0D9488" stroke-width="2" marker-end="url(#arT)"/>
  <line x1="564" y1="468" x2="590" y2="468" stroke="#0D9488" stroke-width="2" marker-end="url(#arT)"/>
  <line x1="818" y1="468" x2="844" y2="468" stroke="#0D9488" stroke-width="2" marker-end="url(#arT)"/>

  <!-- ================= Validation ================= -->
  <rect x="1088" y="404" width="128" height="128" rx="12" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.7"/>
  <g transform="translate(1112,430)" stroke="#A16207" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 13 l7 7 L21 3"/>
  </g>
  <text x="1152" y="472" text-anchor="middle" font-size="15" font-weight="600" fill="#422006">Validation</text>
  <text x="1152" y="494" text-anchor="middle" font-size="12" fill="#854D0E">PESQ · STOI</text>
  <text x="1152" y="512" text-anchor="middle" font-size="12" fill="#854D0E">SI-SNR · σ-tested</text>

  <!-- ================= Footer metrics ================= -->
  <line x1="64" y1="596" x2="1216" y2="596" stroke="#E2E8F0" stroke-width="1.3"/>
  <g>
    <text x="64" y="634" font-size="24" font-weight="700" fill="#0D9488">2.49</text>
    <text x="64" y="655" font-size="12" fill="#64748B">PESQ · impulsive noise</text>

    <text x="304" y="634" font-size="24" font-weight="700" fill="#0D9488">0.920</text>
    <text x="304" y="655" font-size="12" fill="#64748B">STOI · intelligibility</text>

    <text x="544" y="634" font-size="24" font-weight="700" fill="#0D9488">20.2 dB</text>
    <text x="544" y="655" font-size="12" fill="#64748B">SI-SNR · suppression</text>

    <text x="784" y="634" font-size="24" font-weight="700" fill="#0D9488">83.6 ms</text>
    <text x="784" y="655" font-size="12" fill="#64748B">latency · ITU-T G.114</text>

    <text x="1024" y="634" font-size="24" font-weight="700" fill="#0D9488">₹8,000</text>
    <text x="1024" y="655" font-size="12" fill="#64748B">edge hardware cost</text>
  </g>
</svg>
