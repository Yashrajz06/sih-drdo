<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="52" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A" letter-spacing="0.5">SIGNAL PROCESSING PIPELINE</text>
  <text x="400" y="76" text-anchor="middle" font-size="14" fill="#64748B" letter-spacing="1.4">REAL-TIME DEFENCE SPEECH ENHANCEMENT</text>

  <!-- 1. Microphone input -->
  <rect x="170" y="106" width="460" height="78" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="212" cy="145" r="14" fill="#F1F5F9"/>
  <path d="M212 138 a4 4 0 0 1 4 4 v4 a4 4 0 0 1 -8 0 v-4 a4 4 0 0 1 4 -4 z M206 147 a6 6 0 0 0 12 0 M212 153 v3" stroke="#475569" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="244" y="140" font-size="17" font-weight="600" fill="#0F172A">Microphone Input</text>
  <text x="244" y="162" font-size="13" fill="#64748B">16 kHz mono · speech + battlefield noise</text>

  <!-- noise ingress chips -->
  <g font-size="11" fill="#475569">
    <rect x="170" y="196" width="86" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="213" y="211" text-anchor="middle">Gunfire</text>
    <rect x="264" y="196" width="86" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="307" y="211" text-anchor="middle">Shelling</text>
    <rect x="358" y="196" width="86" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="401" y="211" text-anchor="middle">Rotor</text>
    <rect x="452" y="196" width="86" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="495" y="211" text-anchor="middle">Engine</text>
    <rect x="546" y="196" width="84" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="588" y="211" text-anchor="middle">Siren</text>
  </g>
  <line x1="400" y1="228" x2="400" y2="256" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 2. STFT -->
  <rect x="170" y="264" width="460" height="78" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <g transform="translate(198,132)">
    <rect x="0" y="166" width="4" height="10" rx="2" fill="#94A3B8"/>
    <rect x="7" y="160" width="4" height="22" rx="2" fill="#94A3B8"/>
    <rect x="14" y="154" width="4" height="34" rx="2" fill="#64748B"/>
    <rect x="21" y="162" width="4" height="18" rx="2" fill="#94A3B8"/>
    <rect x="28" y="168" width="4" height="6" rx="2" fill="#94A3B8"/>
  </g>
  <text x="244" y="298" font-size="17" font-weight="600" fill="#0F172A">STFT Analysis</text>
  <text x="244" y="320" font-size="13" fill="#64748B">32 ms window · 16 ms hop · causal framing</text>
  <line x1="400" y1="342" x2="400" y2="378" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 3. Neural model (accent) -->
  <rect x="150" y="386" width="500" height="96" rx="14" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.2"/>
  <rect x="150" y="386" width="500" height="96" rx="14" fill="none" stroke="#0D9488" stroke-width="6" opacity="0.07"/>
  <g transform="translate(186,412)">
    <circle cx="4" cy="8" r="4" fill="#0D9488"/><circle cx="4" cy="24" r="4" fill="#0D9488"/>
    <circle cx="26" cy="0" r="4" fill="#0D9488"/><circle cx="26" cy="16" r="4" fill="#0D9488"/><circle cx="26" cy="32" r="4" fill="#0D9488"/>
    <circle cx="48" cy="8" r="4" fill="#0D9488"/><circle cx="48" cy="24" r="4" fill="#0D9488"/>
    <g stroke="#0D9488" stroke-width="1" opacity="0.5">
      <path d="M8 8 L22 0 M8 8 L22 16 M8 24 L22 16 M8 24 L22 32 M30 0 L44 8 M30 16 L44 8 M30 16 L44 24 M30 32 L44 24"/>
    </g>
  </g>
  <text x="256" y="424" font-size="19" font-weight="700" fill="#0F172A">GTCRN Neural Model</text>
  <text x="256" y="446" font-size="13" fill="#0F766E" font-weight="600">48K parameters · causal · zero lookahead</text>
  <text x="256" y="466" font-size="13" fill="#64748B">defence-noise fine-tuned</text>
  <!-- recurrent state loop -->
  <path d="M650 412 C 694 412, 694 456, 652 456" fill="none" stroke="#0D9488" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="704" y="430" font-size="11" fill="#0D9488" font-weight="600">recurrent</text>
  <text x="704" y="445" font-size="11" fill="#0D9488" font-weight="600">state</text>
  <line x1="400" y1="482" x2="400" y2="518" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 4. Complex mask -->
  <rect x="170" y="526" width="460" height="78" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <g transform="translate(200,552)" stroke="#475569" stroke-width="1.6" fill="none">
    <rect x="0" y="0" width="26" height="26" rx="4"/>
    <path d="M0 13 h26 M13 0 v26" opacity="0.45"/>
  </g>
  <text x="244" y="560" font-size="17" font-weight="600" fill="#0F172A">Complex Mask</text>
  <text x="244" y="582" font-size="13" fill="#64748B">magnitude + phase — suppress noise, retain speech</text>
  <line x1="400" y1="604" x2="400" y2="640" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 5. Reconstruction -->
  <rect x="170" y="648" width="460" height="78" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <g transform="translate(198,674)" stroke="#475569" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M0 14 q7 -14 14 0 t14 0"/>
  </g>
  <text x="244" y="682" font-size="17" font-weight="600" fill="#0F172A">iSTFT · Overlap-Add</text>
  <text x="244" y="704" font-size="13" fill="#64748B">continuous waveform reconstruction</text>
  <line x1="400" y1="726" x2="400" y2="762" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 6. Output -->
  <rect x="170" y="770" width="460" height="78" rx="12" fill="#0F172A"/>
  <g transform="translate(200,796)" stroke="#5EEAD4" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M2 16 v-4 a11 11 0 0 1 22 0 v4"/>
    <rect x="0" y="15" width="6" height="11" rx="3" fill="#5EEAD4" stroke="none"/>
    <rect x="20" y="15" width="6" height="11" rx="3" fill="#5EEAD4" stroke="none"/>
  </g>
  <text x="244" y="804" font-size="17" font-weight="700" fill="#FFFFFF">Clean Speech Output</text>
  <text x="244" y="826" font-size="13" fill="#94A3B8">to headset / comms unit</text>

  <!-- Metrics footer -->
  <g>
    <rect x="170" y="886" width="142" height="62" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="241" y="913" text-anchor="middle" font-size="21" font-weight="700" fill="#0D9488">83.6 ms</text>
    <text x="241" y="932" text-anchor="middle" font-size="11" fill="#64748B" letter-spacing="0.6">END-TO-END</text>

    <rect x="329" y="886" width="142" height="62" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="400" y="913" text-anchor="middle" font-size="21" font-weight="700" fill="#0D9488">0.09</text>
    <text x="400" y="932" text-anchor="middle" font-size="11" fill="#64748B" letter-spacing="0.6">REAL-TIME FACTOR</text>

    <rect x="488" y="886" width="142" height="62" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="559" y="913" text-anchor="middle" font-size="21" font-weight="700" fill="#0D9488">2.49</text>
    <text x="559" y="932" text-anchor="middle" font-size="11" fill="#64748B" letter-spacing="0.6">PESQ · IMPULSIVE</text>
  </g>
</svg>
