<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
  </defs>

  <rect width="1440" height="810" fill="#FFFFFF"/>

  <!-- ================= TITLE ================= -->
  <text x="44" y="42" font-size="24" font-weight="700" fill="#0F172A">How the System Works</text>
  <text x="44" y="64" font-size="13.5" fill="#64748B">Removing battlefield noise from radio speech, in real time</text>

  <!-- ============================================================
       BOUNDARY 1 — IN THE FIELD
       ============================================================ -->
  <rect x="212" y="86" width="978" height="322" rx="10" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="2 4"/>
  <text x="1178" y="398" text-anchor="end" font-size="12.5" font-weight="700" fill="#475569" letter-spacing="0.8">IN THE FIELD — a small device, works without internet</text>

  <!-- group: step 1 -->
  <rect x="238" y="112" width="268" height="228" rx="9" fill="none" stroke="#EA8C2B" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="248" y="130" font-size="11.5" font-weight="700" fill="#EA8C2B">STEP 1 · Break the sound apart</text>

  <!-- Cut into slices -->
  <rect x="268" y="150" width="70" height="70" rx="13" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
  <g transform="translate(288,170)" stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round">
    <circle cx="3.5" cy="3.5" r="3"/><circle cx="3.5" cy="26.5" r="3"/><path d="M6.5 5.5 L28 24 M6.5 24.5 L28 6"/>
  </g>
  <text x="303" y="238" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Cut Into Slices</text>
  <text x="303" y="254" text-anchor="middle" font-size="10.5" fill="#64748B">tiny 16 ms pieces</text>

  <!-- Split by pitch -->
  <rect x="392" y="150" width="70" height="70" rx="13" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
  <g transform="translate(410,172)">
    <rect x="0" y="9" width="4" height="9" rx="2" fill="#2563EB"/>
    <rect x="8" y="3" width="4" height="21" rx="2" fill="#2563EB"/>
    <rect x="16" y="0" width="4" height="27" rx="2" fill="#2563EB"/>
    <rect x="24" y="6" width="4" height="15" rx="2" fill="#2563EB"/>
    <rect x="32" y="11" width="4" height="6" rx="2" fill="#2563EB"/>
  </g>
  <text x="427" y="238" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Split By Pitch</text>
  <text x="427" y="254" text-anchor="middle" font-size="10.5" fill="#64748B">low, mid and high</text>

  <line x1="342" y1="185" x2="386" y2="185" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>

  <!-- group: step 2 -->
  <rect x="530" y="112" width="290" height="228" rx="9" fill="none" stroke="#EA8C2B" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="540" y="130" font-size="11.5" font-weight="700" fill="#EA8C2B">STEP 2 · AI decides what to keep</text>

  <!-- AI -->
  <rect x="566" y="150" width="70" height="70" rx="13" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.2"/>
  <g transform="translate(582,168)">
    <circle cx="3" cy="7" r="3" fill="#0D9488"/><circle cx="3" cy="21" r="3" fill="#0D9488"/>
    <circle cx="19" cy="0" r="3" fill="#0D9488"/><circle cx="19" cy="14" r="3" fill="#0D9488"/><circle cx="19" cy="28" r="3" fill="#0D9488"/>
    <circle cx="35" cy="7" r="3" fill="#0D9488"/><circle cx="35" cy="21" r="3" fill="#0D9488"/>
    <g stroke="#0D9488" stroke-width="0.9" opacity="0.5">
      <path d="M6 7 L16 0 M6 7 L16 14 M6 21 L16 14 M6 21 L16 28 M22 0 L32 7 M22 14 L32 7 M22 14 L32 21 M22 28 L32 21"/>
    </g>
  </g>
  <text x="601" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134E4A">The AI</text>
  <text x="601" y="254" text-anchor="middle" font-size="10.5" fill="#0F766E">voice or noise?</text>

  <!-- Memory -->
  <rect x="700" y="150" width="70" height="70" rx="13" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6"/>
  <g transform="translate(719,169)" stroke="#0F766E" stroke-width="1.8" fill="none" stroke-linecap="round">
    <circle cx="16" cy="16" r="15"/><path d="M16 7 v9 l6 5"/>
  </g>
  <text x="735" y="238" text-anchor="middle" font-size="12.5" font-weight="600" fill="#134E4A">Its Memory</text>
  <text x="735" y="254" text-anchor="middle" font-size="10.5" fill="#0F766E">what it just heard</text>

  <path d="M636 172 H 694" fill="none" stroke="#0D9488" stroke-width="1.7" marker-end="url(#a)"/>
  <path d="M694 198 H 636" fill="none" stroke="#0D9488" stroke-width="1.7" marker-end="url(#a)"/>

  <line x1="466" y1="185" x2="560" y2="185" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>

  <!-- group: step 3 -->
  <rect x="844" y="112" width="268" height="228" rx="9" fill="none" stroke="#EA8C2B" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="854" y="130" font-size="11.5" font-weight="700" fill="#EA8C2B">STEP 3 · Put the voice back together</text>

  <!-- Turn down noise -->
  <rect x="874" y="150" width="70" height="70" rx="13" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
  <g transform="translate(892,169)" stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M0 5 h12 M20 5 h14 M0 16 h20 M28 16 h6 M0 27 h7 M15 27 h19"/>
    <circle cx="16" cy="5" r="3"/><circle cx="24" cy="16" r="3"/><circle cx="11" cy="27" r="3"/>
  </g>
  <text x="909" y="238" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Turn Down Noise</text>
  <text x="909" y="254" text-anchor="middle" font-size="10.5" fill="#64748B">keep the voice</text>

  <!-- Rebuild -->
  <rect x="998" y="150" width="70" height="70" rx="13" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
  <g transform="translate(1014,178)" stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M0 14 q9.5 -18 19 0 t19 0"/>
  </g>
  <text x="1033" y="238" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Rebuild Sound</text>
  <text x="1033" y="254" text-anchor="middle" font-size="10.5" fill="#64748B">join the slices</text>

  <line x1="948" y1="185" x2="992" y2="185" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="780" y1="185" x2="868" y2="185" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>

  <!-- ============ EXTERNAL: microphones ============ -->
  <rect x="70" y="126" width="70" height="70" rx="13" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/>
  <g transform="translate(93,146)" stroke="#334155" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M8 2 a4 4 0 0 1 8 0 v9 a4 4 0 0 1-8 0 z M3.5 13 a8.5 8.5 0 0 0 17 0 M12 21.5 v5"/>
  </g>
  <text x="105" y="214" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Microphone</text>
  <text x="105" y="230" text-anchor="middle" font-size="10.5" fill="#64748B">hears voice + noise</text>

  <rect x="70" y="256" width="70" height="70" rx="13" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="5 3"/>
  <g transform="translate(93,276)" stroke="#94A3B8" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M8 2 a4 4 0 0 1 8 0 v9 a4 4 0 0 1-8 0 z M3.5 13 a8.5 8.5 0 0 0 17 0 M12 21.5 v5"/>
  </g>
  <text x="105" y="344" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748B">Second Mic</text>
  <text x="105" y="360" text-anchor="middle" font-size="10.5" fill="#94A3B8">optional extra</text>

  <path d="M144 161 H 184 V 185 H 262" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>
  <path d="M144 291 H 184 V 185" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- ============ EXTERNAL: headset ============ -->
  <rect x="1256" y="126" width="70" height="70" rx="13" fill="#0F172A"/>
  <g transform="translate(1276,148)" stroke="#5EEAD4" stroke-width="1.9" fill="none" stroke-linecap="round">
    <path d="M2 14 v-3 a13 13 0 0 1 26 0 v3"/>
    <rect x="0" y="13" width="7" height="12" rx="3.5" fill="#5EEAD4" stroke="none"/>
    <rect x="23" y="13" width="7" height="12" rx="3.5" fill="#5EEAD4" stroke="none"/>
  </g>
  <text x="1291" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">Listener</text>
  <text x="1291" y="230" text-anchor="middle" font-size="10.5" fill="#64748B">hears a clear voice</text>

  <path d="M1072 185 H 1250" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>

  <!-- ============================================================
       BOUNDARY 2 — IN THE LAB
       ============================================================ -->
  <rect x="212" y="470" width="978" height="264" rx="10" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="2 4"/>
  <text x="1178" y="724" text-anchor="end" font-size="12.5" font-weight="700" fill="#475569" letter-spacing="0.8">IN THE LAB — done once, before the device ships</text>

  <!-- group: prepare -->
  <rect x="238" y="496" width="392" height="176" rx="9" fill="none" stroke="#EA8C2B" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="248" y="514" font-size="11.5" font-weight="700" fill="#EA8C2B">Prepare the practice material</text>

  <!-- clean recordings -->
  <rect x="288" y="534" width="70" height="70" rx="13" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.6"/>
  <g transform="translate(307,553)" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <path d="M16 0 L31 6 v10c0 8-6 13-15 15-9-2-15-7-15-15V6z"/><path d="M9 15.5 l5 5 L23 11"/>
  </g>
  <text x="323" y="622" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Check The Recordings</text>
  <text x="323" y="638" text-anchor="middle" font-size="10.5" fill="#78350F">drop clips with hidden voices</text>

  <!-- mixing -->
  <rect x="508" y="534" width="70" height="70" rx="13" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.6"/>
  <g transform="translate(526,555)" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M0 4 h9 M0 24 h9"/><path d="M9 4 C21 4 21 24 33 24 M9 24 C21 24 21 4 33 4"/>
  </g>
  <text x="543" y="622" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Make Practice Clips</text>
  <text x="543" y="638" text-anchor="middle" font-size="10.5" fill="#78350F">mix speech with battlefield noise</text>

  <line x1="362" y1="569" x2="502" y2="569" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>

  <!-- group: teach -->
  <rect x="662" y="496" width="392" height="176" rx="9" fill="none" stroke="#EA8C2B" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="672" y="514" font-size="11.5" font-weight="700" fill="#EA8C2B">Teach the AI</text>

  <!-- training -->
  <rect x="712" y="534" width="70" height="70" rx="13" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.6"/>
  <g transform="translate(730,552)" stroke="#B45309" stroke-width="1.7" fill="none" stroke-linejoin="round">
    <rect x="6" y="6" width="22" height="22" rx="3"/><rect x="12" y="12" width="10" height="10" rx="1.5"/>
    <path d="M11 6 V1 M17 6 V1 M23 6 V1 M11 28 v5 M17 28 v5 M23 28 v5 M6 11 H1 M6 17 H1 M6 23 H1 M28 11 h5 M28 17 h5 M28 23 h5"/>
  </g>
  <text x="747" y="622" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Practise, Millions of Times</text>
  <text x="747" y="638" text-anchor="middle" font-size="10.5" fill="#78350F">until it recovers the voice well</text>

  <!-- export -->
  <rect x="932" y="534" width="70" height="70" rx="13" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.6"/>
  <g transform="translate(951,553)" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 22 V2 M8 10 l8-8 8 8"/><path d="M1 22 v6 a2 2 0 0 0 2 2 h26 a2 2 0 0 0 2-2 v-6"/>
  </g>
  <text x="967" y="622" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Shrink &amp; Save</text>
  <text x="967" y="638" text-anchor="middle" font-size="10.5" fill="#78350F">into one small file</text>

  <line x1="786" y1="569" x2="926" y2="569" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="634" y1="569" x2="656" y2="569" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>

  <!-- ============ EXTERNAL: source recordings ============ -->
  <rect x="70" y="500" width="70" height="70" rx="13" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/>
  <g transform="translate(90,518)" stroke="#334155" stroke-width="1.7" fill="none">
    <ellipse cx="15" cy="5" rx="15" ry="5"/><path d="M0 5 v24 a15 5 0 0 0 30 0 V5"/><path d="M0 17 a15 5 0 0 0 30 0"/>
  </g>
  <text x="105" y="588" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Clear Speech</text>
  <text x="105" y="604" text-anchor="middle" font-size="10.5" fill="#64748B">thousands of recordings</text>

  <rect x="70" y="630" width="70" height="70" rx="13" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/>
  <g transform="translate(90,648)" stroke="#334155" stroke-width="1.7" fill="none">
    <ellipse cx="15" cy="5" rx="15" ry="5"/><path d="M0 5 v24 a15 5 0 0 0 30 0 V5"/><path d="M0 17 a15 5 0 0 0 30 0"/>
  </g>
  <text x="105" y="718" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">Battlefield Sounds</text>
  <text x="105" y="734" text-anchor="middle" font-size="10.5" fill="#64748B">gunfire · shelling · helicopters</text>

  <path d="M144 535 H 184 V 569 H 282" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>
  <path d="M144 665 H 184 V 569" fill="none" stroke="#334155" stroke-width="1.7"/>

  <!-- ============ THE TRAINED FILE ============ -->
  <rect x="1256" y="534" width="70" height="70" rx="13" fill="#ECFDF5" stroke="#10B981" stroke-width="2.2"/>
  <g transform="translate(1275,553)" stroke="#059669" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <path d="M16 0 L32 8 v16 L16 32 L0 24 V8z M0 8 L16 16 L32 8 M16 16 v16"/>
  </g>
  <text x="1291" y="622" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064E3B">The Trained AI</text>
  <text x="1291" y="638" text-anchor="middle" font-size="10.5" fill="#047857">one file, about 1 MB</text>

  <line x1="1006" y1="569" x2="1250" y2="569" stroke="#059669" stroke-width="1.8" marker-end="url(#ag)"/>
  <path d="M1291 528 V 440 H 675 V 346" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <rect x="906" y="428" width="146" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="979" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">copied onto the device</text>

  <!-- ============ FOOTER ============ -->
  <line x1="44" y1="762" x2="1396" y2="762" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="44" y="784" font-size="12" fill="#64748B">The AI is taught once in a lab. After that the device works entirely on its own — no internet needed, and nothing you say ever leaves it.</text>
</svg>
